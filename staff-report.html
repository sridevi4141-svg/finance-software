<!DOCTYPE html>
<html lang="en">

<head>

<meta charset="UTF-8">

<meta name="viewport"
content="width=device-width, initial-scale=1.0">

<title>Staff Report</title>



<style>

body{
    margin:0;
    padding:20px;
    background:#f5f5f5;
    font-family:Arial;
}

.container{

    max-width:1000px;

    margin:auto;

    background:white;

    padding:20px;

    border-radius:15px;

    box-shadow:0 5px 15px rgba(0,0,0,.15);

}

h2{

    text-align:center;

    color:#1565c0;

}

.summary{

    display:grid;

    grid-template-columns:repeat(auto-fit,minmax(180px,1fr));

    gap:15px;

    margin:20px 0;

}

.card{

    background:#1565c0;

    color:white;

    padding:15px;

    border-radius:12px;

    text-align:center;

}

.card h3{

    margin:10px 0 0;

}

table{

    width:100%;

    border-collapse:collapse;

    margin-top:20px;

}

th{

    background:#1565c0;

    color:white;

    padding:10px;

}

td{

    padding:10px;

    text-align:center;

    border-bottom:1px solid #ddd;

}

button{

    margin-top:20px;

    padding:12px 25px;

    background:green;

    color:white;

    border:none;

    border-radius:10px;

    cursor:pointer;

}
.filter-box{

    display:flex;
    gap:15px;
    align-items:end;
    flex-wrap:wrap;
    margin:20px 0;

}

.filter-box label{

    font-weight:bold;

}

.filter-box input{

    padding:10px;
    border:1px solid #ccc;
    border-radius:8px;

}

.filter-box button{

    background:#1565c0;
    color:white;
    border:none;
    padding:10px 20px;
    border-radius:8px;
    cursor:pointer;

}

.filter-box button:hover{

    background:#0d47a1;

}


</style>

</head>

<body>

<div class="container">

<h2 id="staffTitle">

Staff Report

</h2>
<div class="filter-box">

    <label>From Date</label>
    <input type="date" id="fromDate">

    <label>To Date</label>
    <input type="date" id="toDate">

    <button onclick="searchReport()">
        🔍 Search
    </button>

</div>
<div class="summary">

<div class="card">

Date

<h3 id="reportDate"></h3>

</div>

<div class="card">

Opening Cash

<h3 id="openingCash">₹0</h3>

</div>

<div class="card">

Loan

<h3 id="loanTotal">₹0</h3>

</div>

<div class="card">

Collection

<h3 id="collectionTotal">₹0</h3>

</div>

<div class="card">

Expenses

<h3 id="expenses">₹0</h3>

</div>

<div class="card">

Closing Cash

<h3 id="closingCash">₹0</h3>

</div>

</div>

<h3>Today's Loans</h3>

<table>

<thead>

<tr>

<th>S.No</th>

<th>Customer</th>

<th>Loan</th>

</tr>

</thead>

<tbody id="loanBody">

</tbody>

</table>

<h3>Today's Collections</h3>

<table>

<thead>

<tr>

<th>S.No</th>

<th>Customer</th>

<th>Paid</th>

</tr>

</thead>

<tbody id="collectionBody">

</tbody>

</table>

<button onclick="downloadExcel()">

📥 Download Excel

</button>

</div>
<script src="https://cdn.jsdelivr.net/npm/xlsx/dist/xlsx.full.min.js"></script>

<script type="module" src="staff-report.js"></script>



</body>

</html>
