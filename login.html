<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Owner Login</title>

<style>

*{
    margin:0;
    padding:0;
    box-sizing:border-box;
    font-family:Arial,sans-serif;
}

body{
    background:#f5f5f5;
    display:flex;
    justify-content:center;
    align-items:center;
    height:100vh;
}

.login-box{
    width:350px;
    background:white;
    padding:30px;
    border-radius:10px;
    box-shadow:0 5px 15px rgba(0,0,0,.2);
}

h2{
    text-align:center;
    margin-bottom:25px;
}

input{
    width:100%;
    padding:12px;
    margin-top:12px;
    border:1px solid #ccc;
    border-radius:5px;
    font-size:16px;
}

button{
    width:100%;
    padding:12px;
    margin-top:20px;
    border:none;
    border-radius:5px;
    background:#1565C0;
    color:white;
    font-size:16px;
    cursor:pointer;
}

button:hover{
    background:#0d47a1;
}

.forgot-password{
    text-align:right;
    color:#1565C0;
    cursor:pointer;
    margin-top:12px;
    font-size:14px;
}

.forgot-password:hover{
    text-decoration:underline;
}

.create-account{
    text-align:center;
    margin-top:20px;
    font-size:14px;
}

.create-account a{
    color:#2E7D32;
    font-weight:bold;
    text-decoration:none;
}

.create-account a:hover{
    text-decoration:underline;
}

</style>
</head>

<body>

<div class="login-box">

<h2>Owner Login</h2>

<input
type="text"
id="loginUsername"
placeholder="Username">

<input
type="password"
id="loginPassword"
placeholder="Password">

<button onclick="loginOwner()">
Login
</button>

<p class="forgot-password"
onclick="location.href='forgot-password.html'">
Forgot Password?
</p>

<p class="create-account">
New Owner?
<a href="create-owner.html">
Create Account
</a>
</p>

</div>

</body>
<script type="module" src="login.js"></script>
</html>
